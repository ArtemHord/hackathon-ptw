<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas (AI) · Call Crew</title>
<meta name="viewport" content="width=1280, height=720">
<link rel="icon" href="data:,">
<link rel="preload" href="/agent/assets/DrukWideCyr.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Recall renders this page at 1280x720 on a small CPU: one canvas, 30 fps cap, blurs on tiny buffers. */
  @font-face { font-family: "Druk Wide Cyr"; src: url("/agent/assets/DrukWideCyr.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Onest"; src: url("/agent/assets/Onest-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("/agent/assets/JetBrainsMono-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; color: #FFF3E6;
    background: radial-gradient(75% 95% at 50% 50%, #5E1636 0%, #3A0A21 55%, #1E0411 100%);
    font-family: Onest, system-ui, sans-serif; }
  #orb { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .ask { position: absolute; left: 625px; right: 70px; top: 0; bottom: 0; display: none;
    flex-direction: column; justify-content: center; gap: 40px; }
  .q { display: flex; flex-wrap: wrap; column-gap: .3em; row-gap: .1em;
    font: 400 50px/1.02 "Druk Wide Cyr", "Arial Black", sans-serif; color: #FFF3E6; }
  .q .w { white-space: nowrap; }
  .caret { display: inline-block; width: .12em; height: .84em; margin-left: .06em; background: #FF8A1A; vertical-align: -.06em; }
  .plate { position: relative; width: 620px; height: 90px; flex: none; background: #2A0814;
    box-shadow: inset 0 0 0 1px rgba(255,227,163,.08); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #7A2A2C; }
  .phrase { position: relative; height: 100%; display: flex; align-items: center; padding: 0 36px; overflow: hidden;
    font: 400 32px/1 "Druk Wide Cyr", "Arial Black", sans-serif; color: #FFF3E6; white-space: nowrap; }
  .tag { position: absolute; left: 22px; bottom: 22px; display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-radius: 10px; background: rgba(20,4,12,.55); font: 500 20px Onest, system-ui, sans-serif; }
  .tag .lbl { font: 400 17px "JetBrains Mono", ui-monospace, monospace; color: #FFB36B; padding: 3px 8px;
    border-radius: 6px; background: rgba(255,138,26,.16); }
  .caption { position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%); width: 1000px;
    text-align: center; font: 400 24px/1.35 Onest, system-ui, sans-serif; color: rgba(255,243,230,.82); }
  body.asking .caption { display: none; }
  .status { position: absolute; right: 20px; bottom: 16px; display: flex; align-items: center;
    gap: 8px; font: 400 13px "JetBrains Mono", ui-monospace, monospace; color: rgba(255,243,230,.35); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  .dot.on { background: #22c55e; }
  .dot.bad { background: #ef4444; }
</style>
</head>
<body>
<canvas id="orb" width="1280" height="720"></canvas>
<div class="ask" id="ask">
  <div class="q" id="askQ"></div>
  <div class="plate" id="plate"><div class="fill" id="fill"></div><div class="phrase" id="phrase"></div></div>
</div>
<div class="caption" id="caption"></div>
<div class="tag" id="tag">Atlas<span class="lbl" id="lbl">idle</span></div>
<div class="status"><div class="dot" id="dot"></div><span id="status">connecting</span></div>
<script src="/agent/orb.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var meetingId = qs.get("meeting_id") || "";
  var token = qs.get("token") || "";
  var dot = document.getElementById("dot");
  var statusEl = document.getElementById("status");
  var caption = document.getElementById("caption");

  var ws = null;
  var queue = [];
  var playing = false;
  var audioCtx = null;
  var outAnalyser = null;
  var micAnalyser = null;
  var debugView = false;
  var routed = false; // current item goes through outAnalyser (else the orb uses a synthetic level)

  function setStatus(cls, text) {
    dot.className = "dot" + (cls ? " " + cls : "");
    statusEl.textContent = text;
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify(obj)); } catch (e) { /* reconnect will follow */ }
    }
  }

  function setSpeaking(value, id) {
    document.body.classList.toggle("speaking", value);
    send({ type: "speaking", value: value, id: id || null });
  }

  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    resumeCtx();
    return audioCtx;
  }

  function resumeCtx() {
    if (audioCtx && audioCtx.state === "suspended") {
      try {
        var r = audioCtx.resume();
        if (r && r.catch) { r.catch(function () { /* retried on the next play */ }); }
      } catch (e) { /* ignore */ }
    }
  }

  // The orb is decoration: if orb.js failed to load or throws, audio and the WS keep working.
  function orb(fn) {
    if (!window.CrewOrb) { return undefined; }
    try { return fn(window.CrewOrb); } catch (e) { console.warn("orb", e); return undefined; }
  }

  // Everything we play goes through one AnalyserNode into ctx.destination (the call hears it),
  // so the orb can swell with the real output level.
  function outNode() {
    var c = ctx();
    if (!outAnalyser) {
      outAnalyser = c.createAnalyser();
      outAnalyser.fftSize = 512;
      outAnalyser.connect(c.destination);
    }
    return outAnalyser;
  }

  var rmsBuf = null;
  function rms(an) {
    if (!rmsBuf || rmsBuf.length !== an.fftSize) { rmsBuf = new Float32Array(an.fftSize); }
    an.getFloatTimeDomainData(rmsBuf);
    var sum = 0;
    for (var i = 0; i < rmsBuf.length; i++) { sum += rmsBuf[i] * rmsBuf[i]; }
    return Math.sqrt(sum / rmsBuf.length);
  }

  // Recall feeds the call audio to the page as its microphone: room level drives "listening".
  // Denied / missing mic: the orb just stays idle. Never routed to the speakers (gain 0).
  function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { return; }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      var c = ctx();
      var an = c.createAnalyser();
      an.fftSize = 1024;
      var mute = c.createGain();
      mute.gain.value = 0;
      c.createMediaStreamSource(stream).connect(an);
      an.connect(mute).connect(c.destination);
      micAnalyser = an;
    }, function (e) { console.info("mic unavailable, orb stays idle:", e && e.name); });
  }

  // Each player calls done() exactly once; a watchdog covers a missing "ended" event.
  function playMp3(msg, done) {
    var audio = new Audio("data:audio/mpeg;base64," + msg.audio_b64);
    resumeCtx(); // retry: the context may have been created before autoplay was allowed
    try {
      // Only reroute when the context runs: a suspended context would silence the element.
      routed = false;
      if (ctx().state === "running") {
        ctx().createMediaElementSource(audio).connect(outNode());
        routed = true;
      }
    } catch (e) { console.warn("analyser routing failed", e); }
    var finished = false;
    var watchdog = null;
    function finish() {
      if (finished) { return; }
      finished = true;
      clearTimeout(watchdog);
      done();
    }
    audio.onended = finish;
    audio.onerror = finish;
    audio.onloadedmetadata = function () {
      clearTimeout(watchdog);
      var secs = isFinite(audio.duration) ? audio.duration : 30;
      watchdog = setTimeout(finish, (secs + 2) * 1000);
    };
    watchdog = setTimeout(finish, 60000);
    var p = audio.play();
    if (p && p.catch) { p.catch(function (e) { console.warn("play() rejected", e); finish(); }); }
  }

  function playTone(done) {
    try {
      var c = ctx();
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.4, c.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.6);
      osc.connect(gain).connect(outNode());
      routed = c.state === "running";
      osc.start();
      osc.stop(c.currentTime + 0.62);
      osc.onended = done;
      setTimeout(done, 1500); // in case onended never fires (suspended context)
    } catch (e) {
      console.warn("tone failed", e);
      done();
    }
  }

  function next() {
    if (playing) { return; }
    var msg = queue.shift();
    if (!msg) { return; }
    playing = true;
    caption.textContent = msg.text || "";
    setSpeaking(true, msg.id);
    var called = false;
    function done() {
      if (called) { return; }
      called = true;
      playing = false;
      if (queue.length === 0) {
        setSpeaking(false, msg.id);
        caption.textContent = "";
      }
      next();
    }
    if (msg.type === "tone") { playTone(done); } else { playMp3(msg, done); }
  }

  function onMessage(ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg || typeof msg !== "object") { return; }
    if (msg.type === "say") { msg.type = "play"; } // SPEC name, same payload
    if (msg.type === "state") { orb(function (o) { o.setServerState(msg.state); }); return; }
    if (msg.type === "ask") { orb(function (o) { o.ask(msg); }); return; }
    if (msg.type === "ask_done") { orb(function (o) { o.askDone(msg); }); return; }
    if ((msg.type === "play" && msg.audio_b64) || msg.type === "tone") {
      queue.push(msg);
      next();
    }
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + location.host + "/agent-page/ws?meeting_id=" +
      encodeURIComponent(meetingId) + "&token=" + encodeURIComponent(token);
    setStatus("", "connecting");
    try { ws = new WebSocket(url); } catch (e) { setTimeout(connect, 2000); return; }
    ws.onopen = function () {
      setStatus("on", "live");
      send({ type: "speaking", value: playing, id: null }); // re-sync after reconnect
    };
    ws.onmessage = onMessage;
    ws.onclose = function (ev) {
      setStatus(ev.code === 4401 ? "bad" : "", ev.code === 4401 ? "unauthorized" : "reconnecting");
      ws = null;
      setTimeout(connect, 2000);
    };
    ws.onerror = function () { /* onclose follows */ };
  }

  debugView = !!orb(function (o) {
    o.levels.out = function () { return playing && routed && outAnalyser ? rms(outAnalyser) : null; };
    o.levels.mic = function () { return micAnalyser ? rms(micAnalyser) : null; };
    return o.init({
      canvas: document.getElementById("orb"),
      ask: document.getElementById("ask"),
      question: document.getElementById("askQ"),
      plate: document.getElementById("plate"),
      fill: document.getElementById("fill"),
      phrase: document.getElementById("phrase"),
      label: document.getElementById("lbl"),
      inputs: function () { return { playing: playing }; }
    });
  });
  if (qs.get("tag") === "0") { document.getElementById("tag").style.display = "none"; }
  window.__crewInject = function (obj) { onMessage({ data: JSON.stringify(obj) }); }; // debug / Playwright

  if (debugView) { // ?demo=1 / ?state=: visual check without a backend
    setStatus("", "demo");
  } else {
    if (!meetingId) { setStatus("bad", "no meeting_id"); }
    try { startMic(); } catch (e) { console.info("mic unavailable", e); }
    connect();
  }
})();
</script>
</body>
</html>
